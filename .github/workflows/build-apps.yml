name: Applications Windows et Mac

on:
  workflow_dispatch:      # onglet Actions → « Applications Windows et Mac » → Run workflow
    inputs:
      version:
        description: "Numéro de version (ex. 1.0.1)"
        required: true
        default: "1.0.0"

env:
  DOUBLAGE_VERSION: ${{ inputs.version }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de construction
        run: python -m pip install "pyinstaller>=6.10,<7" "pywebview>=5.3,<7"
      - name: Application
        run: python launcher/build.py
      - name: Vérification
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          if (-not (Test-Path dist\StudioRythmo-Setup.exe)) { exit 1 }
          if (-not (Test-Path dist\JoueTaReplique\JoueTaReplique.exe)) { exit 1 }
          if (-not (Test-Path dist\JoueTaReplique\_internal\app\web.py)) { exit 1 }
          if (-not (Test-Path dist\JoueTaReplique\_internal\uv.exe)) { exit 1 }
          if (-not (Test-Path dist\JoueTaReplique\_internal\setup.html)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: JoueTaReplique-Windows
          path: dist/StudioRythmo-Setup.exe

  mac:
    runs-on: macos-15     # puces Apple (M1, M2, M3, M4…)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de construction
        run: |
          python -m pip install "pyinstaller>=6.10,<7" "pywebview>=5.3,<7"
          brew install create-dmg
      - name: Application
        run: python launcher/build.py
      - name: Image disque (.dmg)
        run: |
          APP="dist/Studio Rythmo.app"
          test -d "$APP"
          test -f "$APP/Contents/Resources/app/web.py" || test -f "$APP/Contents/Frameworks/app/web.py"
          mkdir -p dmg && cp -R "$APP" dmg/
          tiffutil -cathidpicheck launcher/dmg-background.png launcher/dmg-background@2x.png -out dmg-background.tiff
          for i in 1 2 3; do
            create-dmg --volname "Studio Rythmo" --volicon launcher/icon.icns --background dmg-background.tiff \
              --window-pos 200 160 --window-size 660 420 --icon-size 110 --text-size 13 \
              --icon "Studio Rythmo.app" 165 235 --hide-extension "Studio Rythmo.app" --app-drop-link 495 235 \
              --no-internet-enable "dist/StudioRythmo-Mac.dmg" dmg/ && break
            sleep 10
          done
          ls -la dist
          test -f "dist/StudioRythmo-Mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: JoueTaReplique-Mac
          path: dist/StudioRythmo-Mac.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Studio Rythmo ${{ inputs.version }}
          make_latest: true
          files: out/*
          body: |
            **Windows** : télécharge `StudioRythmo-Setup.exe` et lance-le.
            **Mac** (M1, M2, M3, M4…) : ouvre `StudioRythmo-Mac.dmg` et glisse Studio Rythmo dans Applications.

            Au premier lancement, Studio Rythmo installe son moteur (10 à 20 minutes, une seule fois).
