name: Applications Windows et Mac

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de construction
        run: python -m pip install "pyinstaller>=6.10,<7" "pywebview>=5.3,<7"
      - name: Version
        shell: bash
        run: echo "DOUBLAGE_VERSION=${GITHUB_REF_NAME/#v/}" >> $GITHUB_ENV
      - name: Application
        run: python launcher/build.py
      - name: Installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:DOUBLAGE_VERSION } else { "1.0.0" }
          $env:DOUBLAGE_VERSION = $v
          & $iscc launcher\Doublage.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Vérification
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          if (-not (Test-Path dist\Doublage-Setup.exe)) { exit 1 }
          if (-not (Test-Path dist\Doublage\Doublage.exe)) { exit 1 }
          if (-not (Test-Path dist\Doublage\_internal\app\web.py)) { exit 1 }
          if (-not (Test-Path dist\Doublage\_internal\uv.exe)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Doublage-Windows
          path: dist/Doublage-Setup.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # puces Apple (M1, M2, M3, M4…)
            arch: AppleSilicon
          - runner: macos-13   # Mac Intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'Intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de construction
        run: |
          python -m pip install "pyinstaller>=6.10,<7" "pywebview>=5.3,<7"
          brew install create-dmg
      - name: Version
        run: echo "DOUBLAGE_VERSION=${GITHUB_REF_NAME/#v/}" >> $GITHUB_ENV
      - name: Application
        run: python launcher/build.py
      - name: Image disque (.dmg)
        run: |
          test -d dist/Doublage.app
          test -f dist/Doublage.app/Contents/Resources/app/web.py || test -f dist/Doublage.app/Contents/Frameworks/app/web.py
          mkdir -p dmg && cp -R dist/Doublage.app dmg/
          tiffutil -cathidpicheck launcher/dmg-background.png launcher/dmg-background@2x.png -out dmg-background.tiff
          for i in 1 2 3; do
            create-dmg --volname "Doublage" --volicon launcher/icon.icns --background dmg-background.tiff \
              --window-pos 200 160 --window-size 660 420 --icon-size 110 --text-size 13 \
              --icon "Doublage.app" 165 235 --hide-extension "Doublage.app" --app-drop-link 495 235 \
              --no-internet-enable "dist/Doublage-Mac-${{ matrix.arch }}.dmg" dmg/ && break
            sleep 10
          done
          ls -la dist
          test -f "dist/Doublage-Mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Doublage-Mac-${{ matrix.arch }}
          path: dist/Doublage-Mac-${{ matrix.arch }}.dmg

  release:
    needs: [windows, mac]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'derniere-version' }}
          name: ${{ github.ref_type == 'tag' && format('Doublage {0}', github.ref_name) || 'Doublage (dernière version)' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          files: out/*
          body: |
            **Windows** : télécharge `Doublage-Setup.exe` et lance-le.
            **Mac** : `Doublage-Mac-AppleSilicon.dmg` (M1, M2, M3, M4…) ou `Doublage-Mac-Intel.dmg`, ouvre-le et glisse Doublage dans Applications.

            Au premier lancement, Doublage installe son moteur (10 à 20 minutes, une seule fois).
